<!-- @dsCard group="Gráficos" height=320 subtitle="Tendencia con área, objetivo y punto final" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Line chart</title>
<style>body{padding:20px}</style></head>
<body>
<div class="oto-card">
  <div class="oto-card__head"><div><h3 class="oto-card__title">Clientes por mes</h3><p class="oto-card__sub">650 en octubre, 25 sobre el objetivo</p></div>
    <div class="oto-legend"><span><i class="oto-swatch"></i>Clientes</span><span><i class="oto-swatch oto-swatch--target"></i>Objetivo (625)</span></div></div>
  <svg class="oto-chart" id="c" viewBox="0 0 600 220" role="img" aria-label="Clientes nuevos por mes contra objetivo"></svg>
</div>
<script>
const v=[480,520,590,560,610,580,600,630,640,650], m=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct'];
const svg=document.getElementById('c'), NS='http://www.w3.org/2000/svg', W=600,H=220,L=40,R=12,T=10,B=24, iw=W-L-R, ih=H-T-B, lo=400, hi=700;
const x=i=>L+iw/9*i, y=n=>T+ih-(n-lo)/(hi-lo)*ih;
const mk=(t,a,s)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);if(s)n.setAttribute('style',s);svg.appendChild(n);return n;};
[400,500,600,700].forEach(n=>{mk('line',{x1:L,x2:W-R,y1:y(n),y2:y(n)},'stroke:var(--chart-grid)');mk('text',{x:L-8,y:y(n)+4,'text-anchor':'end'}).textContent=n;});
[0,3,6,9].forEach(i=>{mk('text',{x:x(i),y:H-6,'text-anchor':'middle'}).textContent=m[i];});
const d=v.map((n,i)=>(i?'L':'M')+x(i)+','+y(n)).join('');
mk('path',{d:d+`L${x(9)},${y(lo)}L${x(0)},${y(lo)}Z`},'fill:var(--series-1);fill-opacity:.12');
mk('line',{x1:L,x2:W-R,y1:y(625),y2:y(625),'stroke-dasharray':'5 4'},'stroke:var(--chart-target);stroke-width:1.5');
mk('path',{d},'fill:none;stroke:var(--series-1);stroke-width:2;stroke-linejoin:round');
mk('circle',{cx:x(9),cy:y(650),r:5},'fill:var(--series-1);stroke:var(--surface);stroke-width:2');
</script>
</body></html>
