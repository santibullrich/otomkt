<!-- @dsCard group="Números" height=200 subtitle="Etiqueta, valor, variación y sparkline" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>KPI card</title>
<style>body{padding:20px}</style></head>
<body>
<div class="oto-kpi-strip">
  <div class="oto-kpi">
    <div class="oto-kpi__label">Clientes conseguidos</div>
    <div class="oto-kpi__value">5,860</div>
    <div class="oto-kpi__foot"><span class="oto-delta is-good">▲ 1.6%</span>vs. septiembre</div>
    <svg class="oto-kpi__spark" viewBox="0 0 200 36" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,30 L22,26 L44,18 L66,22 L88,14 L111,19 L133,15 L155,10 L177,8 L200,6 L200,36 L0,36Z" style="fill:var(--series-1);fill-opacity:.12"/>
      <path d="M0,30 L22,26 L44,18 L66,22 L88,14 L111,19 L133,15 L155,10 L177,8 L200,6" style="fill:none;stroke:var(--series-1);stroke-width:2;vector-effect:non-scaling-stroke"/>
    </svg>
  </div>
  <div class="oto-kpi">
    <div class="oto-kpi__label">Gasto total</div>
    <div class="oto-kpi__value">US$ 911,000</div>
    <div class="oto-kpi__foot"><span class="oto-delta">76%</span>del budget anual</div>
  </div>
  <div class="oto-kpi">
    <div class="oto-kpi__label">CAC total</div>
    <div class="oto-kpi__value">US$ 155</div>
    <div class="oto-kpi__foot"><span class="oto-delta is-bad">▲ 3.1%</span>vs. septiembre</div>
  </div>
</div>
</body></html>
