<!-- @dsCard group="Layout" height=200 subtitle="Contenedor con título, subtítulo y acción" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<style>body{padding:20px}</style></head>
<body>
<section class="oto-card">
  <div class="oto-card__head">
    <div><h3 class="oto-card__title">Últimas facturas</h3><p class="oto-card__sub">Llegan a marketing@test.com y suman al gasto real de su canal</p></div>
    <button type="button" class="oto-btn oto-btn--ghost oto-btn--sm">Ver todas</button>
  </div>
  <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
    <div><div style="font-weight:500">Google Ireland Ltd.</div><div class="oto-muted" style="font-size:13px">28/10 · Google Ads · Consumo de septiembre</div></div>
    <div style="display:flex;gap:10px;align-items:center"><span class="oto-num" style="font-weight:600">US$ 28,300</span><span class="oto-badge oto-badge--positive">Asignada</span></div>
  </div>
</section>
</body></html>
