<!-- @dsCard group="Formularios" height=220 subtitle="Input, número editable y área de texto" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Field</title>
<style>body{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;align-items:start}</style></head>
<body>
<div class="oto-field"><label for="f1">Casilla de facturas</label><input id="f1" class="oto-input" value="marketing@test.com"><span class="oto-hint">Reenviá acá las facturas de tus proveedores.</span></div>
<div class="oto-field"><label for="f2">Budget de octubre (US$ K)</label><input id="f2" class="oto-input oto-input--num" type="number" value="27.5" step="0.5"></div>
<div class="oto-field" style="grid-column:1/-1"><label for="f3">Condiciones del contrato</label><textarea id="f3" class="oto-input" rows="3" placeholder="Ej.: US$ 1.000 fijos por mes más 0,001% del volumen operado"></textarea></div>
</body></html>
